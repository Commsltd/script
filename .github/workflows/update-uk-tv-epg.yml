name: Update UK TV EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "uk-tv-epg/**"
      - ".github/workflows/update-uk-tv-epg.yml"
  schedule:
    - cron: "20 05,18 * * *"

permissions:
  contents: write

concurrency:
  group: update-uk-tv-epg
  cancel-in-progress: true

env:
  PLAYLIST_URL: https://iptv-org.github.io/iptv/countries/uk.m3u
  ALT_STREAMS_URL: https://raw.githubusercontent.com/iptv-org/iptv/master/streams/uk.m3u
  CARRIER_STREAMS_URL: https://raw.githubusercontent.com/iptv-ch/iptv-ch.github.io/master/netplus-zappr.m3u8
  EXTERNAL_UK_STREAMS_URL: https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_uk.m3u8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get current IPTV-org EPG grabber
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git "$RUNNER_TEMP/iptv-epg"

      - name: Install grabber dependencies
        working-directory: ${{ runner.temp }}/iptv-epg
        run: npm ci

      - name: Build structured UK playlist
        run: |
          python3 uk-tv-epg/epg_helper.py build-playlist \
            "$PLAYLIST_URL" \
            "$ALT_STREAMS_URL" \
            "$CARRIER_STREAMS_URL" \
            "$EXTERNAL_UK_STREAMS_URL" \
            "$RUNNER_TEMP/playlist.m3u"

      - name: Select Freeview channels matching the merged playlist
        run: |
          python3 uk-tv-epg/epg_helper.py prepare \
            "$RUNNER_TEMP/iptv-epg/sites/freeview.co.uk/freeview.co.uk.channels.xml" \
            "$RUNNER_TEMP/playlist.m3u" \
            "$RUNNER_TEMP/custom.channels.xml" \
            "$RUNNER_TEMP/aliases.json"

      - name: Grab current Freeview listings
        working-directory: ${{ runner.temp }}/iptv-epg
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          npm run grab --- \
            --channels="$RUNNER_TEMP/custom.channels.xml" \
            --output="$RUNNER_TEMP/guide.xml" \
            --days=7 \
            --maxConnections=4 > "$RUNNER_TEMP/grab.log" 2>&1
          status=$?
          tail -n 80 "$RUNNER_TEMP/grab.log" || true
          exit $status

      - name: Download UK programme metadata enrichment
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz" \
            -o "$RUNNER_TEMP/epgshare_UK1.xml.gz" || true

      - name: Enrich programme descriptions and metadata
        run: |
          python3 uk-tv-epg/epg_helper.py enrich \
            "$RUNNER_TEMP/guide.xml" \
            "$RUNNER_TEMP/epgshare_UK1.xml.gz"

      - name: Add playlist aliases and compress
        run: |
          python3 uk-tv-epg/epg_helper.py apply \
            "$RUNNER_TEMP/guide.xml" \
            "$RUNNER_TEMP/aliases.json" \
            "$RUNNER_TEMP/playlist.m3u" \
            "$RUNNER_TEMP/guide.xml.gz"

      - name: Validate generated guide
        run: |
          python3 - <<'PY'
          import gzip, os, xml.etree.ElementTree as ET
          p = os.path.join(os.environ["RUNNER_TEMP"], "guide.xml.gz")
          with gzip.open(p, "rb") as f:
              root = ET.parse(f).getroot()
          channels = root.findall("channel")
          programmes = root.findall("programme")
          descriptions = [p.find("desc") for p in programmes]
          descriptions = [d for d in descriptions if d is not None and (d.text or "").strip()]
          subtitles = [p.find("sub-title") for p in programmes]
          subtitles = [d for d in subtitles if d is not None and (d.text or "").strip()]
          print(f"Validated XMLTV: {len(channels)} channels, {len(programmes)} programmes, {len(descriptions)} descriptions, {len(subtitles)} subtitles")
          if len(channels) < 10 or len(programmes) < 100:
              raise SystemExit("Guide looks unexpectedly small; refusing to publish")

          playlist = os.path.join(os.environ["RUNNER_TEMP"], "playlist.m3u")
          text = open(playlist, "r", encoding="utf-8").read()
          extinf_count = text.count("#EXTINF:")
          print(f"Validated playlist: {extinf_count} stream entries")
          if extinf_count < 20:
              raise SystemExit("Structured playlist looks unexpectedly small; refusing to publish")
          for required in ["01 MAIN UK", "02 NEWS", "07 LOCAL & REGIONAL"]:
              if required not in text:
                  raise SystemExit(f"Missing expected playlist group: {required}")
          PY

      - name: Publish guide and structured playlist
        run: |
          cp "$RUNNER_TEMP/guide.xml.gz" /tmp/guide.xml.gz
          cp "$RUNNER_TEMP/playlist.m3u" /tmp/playlist.m3u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan uk-tv-epg-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/guide.xml.gz ./guide.xml.gz
          cp /tmp/playlist.m3u ./playlist.m3u
          printf '%s\n' \
            'Automatically generated UK TV playlist + XMLTV guide.' \
            '' \
            'Playlist:' \
            'https://raw.githubusercontent.com/Commsltd/script/uk-tv-epg-output/playlist.m3u' \
            '' \
            'EPG:' \
            'https://raw.githubusercontent.com/Commsltd/script/uk-tv-epg-output/guide.xml.gz' \
            '' \
            'Groups: MAIN UK, NEWS, FILM & ENTERTAINMENT, KIDS, MUSIC, SPORT, LOCAL & REGIONAL, INTERNATIONAL, RELIGIOUS, SHOPPING, RED BUTTON / SPECIAL EVENTS, ALTERNATIVE STREAMS, OTHER / ODDITIES, EXPERIMENTAL / UNRELIABLE.' \
            > README.txt
          git add guide.xml.gz playlist.m3u README.txt
          git commit -m "Update UK TV playlist and EPG"
          git push --force origin HEAD:uk-tv-epg-output
