name: Build UK Television app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'uk-tv-app/**'
      - '.github/workflows/build-uk-tv-app.yml'
permissions:
  contents: read
concurrency:
  group: uk-television-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test catalogue exporter
        working-directory: uk-tv-app/tools
        run: python3 -m unittest -v test_manifest.py
      - name: Bundle current real channels and enriched listings
        run: |
          git clone --depth 1 --single-branch --branch uk-tv-epg-output https://github.com/Commsltd/script.git "$RUNNER_TEMP/tv-feed"
          revision=$(git -C "$RUNNER_TEMP/tv-feed" rev-parse HEAD)
          python3 uk-tv-app/tools/export_manifest.py --source "$RUNNER_TEMP/tv-feed" --revision "$revision" --output uk-tv-app/app/src/main/assets/catalogue.json.gz
      - name: Compile, unit test and lint
        working-directory: uk-tv-app
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Optional private release signing
        env:
          TV_KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
        run: |
          if [ -n "$TV_KEYSTORE_B64" ]; then
            umask 077
            export TV_KEYSTORE_PATH="$RUNNER_TEMP/tv-release.jks"
            printf '%s' "$TV_KEYSTORE_B64" | base64 --decode > "$TV_KEYSTORE_PATH"
            (cd uk-tv-app && gradle --no-daemon assembleRelease)
            rm -f "$TV_KEYSTORE_PATH"
          fi
      - name: Prepare deliverables
        run: |
          mkdir -p delivery
          cp uk-tv-app/app/build/outputs/apk/debug/app-debug.apk delivery/UK-Television-0.1.0-preview.apk
          cp uk-tv-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk delivery/uk-tv-tests.apk
          if [ -f uk-tv-app/app/build/outputs/apk/release/app-release.apk ]; then
            cp uk-tv-app/app/build/outputs/apk/release/app-release.apk delivery/UK-Television-0.1.0.apk
          fi
          cp uk-tv-app/app/src/main/assets/status.json delivery/catalogue-status.json
          cp uk-tv-app/README.md delivery/README.md
          git archive --format=zip HEAD uk-tv-app .github/workflows/build-uk-tv-app.yml .github/workflows/update-uk-tv-app-data.yml > delivery/UK-Television-source.zip
          sha256sum delivery/*.apk > delivery/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/UK-Television-0.1.0-preview.apk > delivery/apk-signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: UK-Television-build
          path: delivery/
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UK-Television-reports
          path: |
            uk-tv-app/app/build/reports/
            uk-tv-app/app/build/test-results/
          retention-days: 30
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: UK-Television-build
          path: delivery
      - name: Enable hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch TV app and exercise remote navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86
          target: android-tv
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash uk-tv-app/tools/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UK-Television-smoke
          path: |
            delivery/*.png
            delivery/*.log
            delivery/*.xml
          retention-days: 30
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UK-Television-build
          path: delivery
      - uses: actions/download-artifact@v4
        with:
          name: UK-Television-smoke
          path: smoke
      - name: Publish tested preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="uk-tv-v0.1.0-preview-${{ github.run_number }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "UK Television 0.1.0 preview (build ${{ github.run_number }})" --notes-file delivery/README.md delivery/UK-Television-0.1.0-preview.apk delivery/UK-Television-source.zip delivery/SHA256SUMS.txt delivery/apk-signature.txt delivery/catalogue-status.json smoke/guide.png smoke/options.png smoke/playback-test.png
