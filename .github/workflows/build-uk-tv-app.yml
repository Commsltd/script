name: Build UK Television app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'uk-tv-app/**'
      - 'uk-tv-kodi-test/**'
      - '.github/workflows/build-uk-tv-app.yml'
  push:
    branches: [main]
    paths:
      - 'uk-tv-app/app/**'
      - 'uk-tv-app/tools/**'
      - 'uk-tv-app/build.gradle.kts'
      - 'uk-tv-app/settings.gradle.kts'
      - 'uk-tv-app/gradle.properties'
      - 'uk-tv-app/gradle/**'
      - 'uk-tv-app/app/gradle.lockfile'
      - '.github/workflows/build-uk-tv-app.yml'

permissions:
  contents: read

concurrency:
  group: uk-television-build
  cancel-in-progress: true

jobs:
  build:
    outputs:
      publishable: ${{ steps.signer.outputs.publishable }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: '8.14.3'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install catalogue tooling
        run: |
          python3 -m pip install             --disable-pip-version-check             --no-cache-dir             Pillow==11.3.0             yt-dlp==2026.8.19

      - name: Test catalogue, artwork and YouTube resolvers
        working-directory: uk-tv-app/tools
        run: |
          python3 -m unittest discover -v

      - name: Resolve current official YouTube live videos
        run: |
          curl -fsSL --retry 2             "https://raw.githubusercontent.com/Commsltd/script/uk-tv-app-data/youtube-live.json"             -o "$RUNNER_TEMP/previous-youtube-live.json" || true
          python3 uk-tv-app/tools/resolve_youtube_live.py             --previous "$RUNNER_TEMP/previous-youtube-live.json"             --output "$RUNNER_TEMP/youtube-live.json"
          cat "$RUNNER_TEMP/youtube-live.json"

      - name: Bundle current channels, guide and privacy artwork
        run: |
          git clone --depth 1 --single-branch --branch uk-tv-epg-output             https://github.com/Commsltd/script.git "$RUNNER_TEMP/tv-feed"
          revision=$(git -C "$RUNNER_TEMP/tv-feed" rev-parse HEAD)
          python3 uk-tv-app/tools/guide_supplements.py --output-dir "$RUNNER_TEMP/guides"
          python3 uk-tv-app/tools/export_manifest.py             --source "$RUNNER_TEMP/tv-feed"             --revision "$revision"             --guides-dir "$RUNNER_TEMP/guides"             --youtube-live "$RUNNER_TEMP/youtube-live.json"             --output uk-tv-app/app/src/main/assets/catalogue.json.gz

          mkdir -p "$RUNNER_TEMP/build-artwork"
          curl -fsSL --retry 2             "https://raw.githubusercontent.com/Commsltd/script/uk-tv-app-data/artwork.zip"             -o "$RUNNER_TEMP/previous-artwork.zip" || true
          if [ -s "$RUNNER_TEMP/previous-artwork.zip" ]; then
            unzip -q -o "$RUNNER_TEMP/previous-artwork.zip"               -d "$RUNNER_TEMP/build-artwork" || true
          fi

          python3 uk-tv-app/tools/mirror_artwork.py             --catalogue uk-tv-app/app/src/main/assets/catalogue.json.gz             --output-dir "$RUNNER_TEMP/build-artwork"             --zip uk-tv-app/app/src/main/assets/artwork.zip

      - name: Compile, unit test and lint
        working-directory: uk-tv-app
        run: |
          gradle --no-daemon             testDebugUnitTest             lintDebug             lintTvPreview             assembleTvPreview             assembleDebugAndroidTest             --stacktrace

      - name: Optional private release signing
        env:
          TV_KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
        run: |
          if [ -n "$TV_KEYSTORE_B64" ]; then
            umask 077
            export TV_KEYSTORE_PATH="$RUNNER_TEMP/tv-release.jks"
            printf '%s' "$TV_KEYSTORE_B64" | base64 --decode > "$TV_KEYSTORE_PATH"
            (cd uk-tv-app && gradle --no-daemon assembleRelease)
            rm -f "$TV_KEYSTORE_PATH"
          fi

      - name: Resolve app version
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' uk-tv-app/app/build.gradle.kts | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TV_VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare deliverables
        run: |
          mkdir -p delivery
          printf '%s\n' "$TV_VERSION" > delivery/version.txt
          cp uk-tv-app/app/build/outputs/apk/tvPreview/app-tvPreview.apk             delivery/UK-Television-${TV_VERSION}-preview.apk
          cp uk-tv-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk             delivery/uk-tv-tests.apk

          if [ -f uk-tv-app/app/build/outputs/apk/release/app-release.apk ]; then
            cp uk-tv-app/app/build/outputs/apk/release/app-release.apk               delivery/UK-Television-${TV_VERSION}.apk
          fi

          cp uk-tv-app/app/src/main/assets/status.json             delivery/catalogue-status.json
          cp uk-tv-app/app/src/main/assets/artwork-status.json             delivery/artwork-status.json 2>/dev/null || true
          cp "$RUNNER_TEMP/youtube-live.json" delivery/youtube-live.json
          cp uk-tv-app/README.md delivery/README.md

          git archive --format=zip HEAD             uk-tv-app             .github/workflows/build-uk-tv-app.yml             .github/workflows/update-uk-tv-app-data.yml             > delivery/UK-Television-source.zip

          sha256sum delivery/*.apk > delivery/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify             --verbose             --print-certs             delivery/UK-Television-${TV_VERSION}-preview.apk             > delivery/apk-signature.txt

      - name: Check installed-app signing identity
        id: signer
        run: |
          # Never publish an APK that cannot update the installed normal app.
          expected=3d002ac4c166f145c1a96bf9bdf09a2e8e609b18ce5741f119656695f7e217ab
          actual=$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' delivery/apk-signature.txt)
          if [ "$actual" = "$expected" ]; then
            echo 'publishable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publishable=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Tests run normally; publication held because the CI signer differs from the installed app.'
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UK-Television-build
          path: delivery/
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UK-Television-reports
          path: |
            uk-tv-app/app/build/reports/
            uk-tv-app/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 30

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: UK-Television-build
          path: delivery

      - name: Enable hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch TV app and exercise real remote interaction
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 28
          arch: x86
          target: android-tv
          profile: tv_1080p
          ram-size: 1024M
          heap-size: 128M
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          script: bash uk-tv-app/tools/smoke.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: UK-Television-smoke
          path: |
            delivery/*.png
            delivery/*.log
            delivery/*.xml
          if-no-files-found: ignore
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request' && needs.build.outputs.publishable == 'true'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: UK-Television-build
          path: delivery

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: UK-Television-smoke
          path: smoke

      - name: Publish tested preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TV_VERSION=$(cat delivery/version.txt)
          tag="uk-tv-v${TV_VERSION}-preview-${{ github.run_number }}"
          assets=(
            delivery/UK-Television-${TV_VERSION}-preview.apk
            delivery/UK-Television-source.zip
            delivery/SHA256SUMS.txt
            delivery/apk-signature.txt
            delivery/catalogue-status.json
            delivery/youtube-live.json
            smoke/guide.png
            smoke/options.png
            smoke/playback-test.png
          )
          if [ -f smoke/quick-guide.png ]; then
            assets+=(smoke/quick-guide.png)
          fi
          if [ -f delivery/UK-Television-${TV_VERSION}.apk ]; then
            assets+=(delivery/UK-Television-${TV_VERSION}.apk)
          fi

          gh release create "$tag"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --prerelease             --title "UK Television ${TV_VERSION} preview (build ${{ github.run_number }})"             --notes-file delivery/README.md             "${assets[@]}"
